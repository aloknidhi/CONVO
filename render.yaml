services:
  - type: web
    name: convo-backend
    env: node
    plan: free
    region: oregon
    buildCommand: "cd backend && npm install"
    startCommand: "cd backend && npm start"
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://convo-x-nine.vercel.app
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: convo-data
      mountPath: /opt/render/project/backend/data
      sizeGB: 1
